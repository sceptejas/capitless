[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
cache_path = "cache"

solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true

remappings = [
    "@uniswap/v4-core/=lib/v4-core/",
    "@uniswap/v4-periphery/=lib/v4-periphery/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

# Allow scripts to write deployment artifacts
fs_permissions = [
    { access = "read-write", path = "./deployments/" }
]

[profile.default.fuzz]
runs = 256

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${BASESCAN_API_KEY}", chain = 11155111, url = "https://api-sepolia.etherscan.io/api" }
